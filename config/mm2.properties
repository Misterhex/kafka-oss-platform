# Cluster aliases
clusters = primary, secondary

primary.bootstrap.servers = kafka-primary:9092
secondary.bootstrap.servers = kafka-secondary:9092

# Replication direction (one-way only)
primary->secondary.enabled = true
secondary->primary.enabled = false

# Replicate ALL topics including internal (clears default exclude pattern)
primary->secondary.topics = .*
primary->secondary.topics.exclude =

# Replicate all consumer groups
primary->secondary.groups = .*
primary->secondary.groups.exclude =

# Keep topic names identical on secondary (no "primary." prefix)
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Consumer offset sync for failover support
primary->secondary.sync.group.offsets.enabled = true
primary->secondary.sync.group.offsets.interval.seconds = 60
primary->secondary.emit.offset-syncs.interval.seconds = 60

# Heartbeats and checkpoints
primary->secondary.heartbeats.enabled = true
primary->secondary.checkpoints.enabled = true
primary->secondary.emit.heartbeats.interval.seconds = 5
primary->secondary.emit.checkpoints.interval.seconds = 60

# Single-node replication factors
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

tasks.max = 1
