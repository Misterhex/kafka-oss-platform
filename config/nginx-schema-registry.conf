events {
    worker_connections 128;
}

http {
    server {
        listen 8081 ssl;

        ssl_certificate     /etc/nginx/certs/schema-registry.cert.pem;
        ssl_certificate_key /etc/nginx/certs/schema-registry.key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            # Block PUT and DELETE to prevent accidental schema modifications/deletions
            if ($request_method ~ ^(PUT|DELETE)$) {
                return 403 '{"error_code": 403, "message": "PUT and DELETE methods are disabled to prevent accidental schema deletions"}';
            }

            proxy_pass http://schema-registry-backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Health check endpoint (no mTLS required)
    server {
        listen 8084;
        listen [::]:8084;

        location /health {
            proxy_pass http://schema-registry-backend:8081/subjects;
        }
    }
}
